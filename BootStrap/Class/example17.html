<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Document</title>
<link rel="stylesheet"
href="./node_modules/bootstrap/dist/css/bootstrap.min.css">
</head>
<body>
<div id="carouselBasic" class="carousel slide" data-bs-ride="carousel">
<div class="carousel-inner">
<div class="carousel-item active">
<img src="https://picsum.photos/1200/400?1" class="d-block
w-100" alt="Nature">
<div class="carousel-caption bg-dark bg-opacity-50 rounded">
<h5>Nature Beauty</h5>
<p>Experience the freshness of green landscapes.</p>
</div>
</div>
<div class="carousel-item">
<img src="https://picsum.photos/1200/400?2" class="d-block
w-100" alt="City">
<div class="carousel-caption bg-dark bg-opacity-50 rounded">
<h5>Urban Adventure</h5>
<p>Explore the modern life of bustling cities.</p>
</div>
</div>
</div>
<button class="carousel-control-prev" type="button"
data-bs-target="#carouselBasic" data-bs-slide="prev">
<span class="carousel-control-prev-icon"></span>
</button>
<button class="carousel-control-next" type="button"
data-bs-target="#carouselBasic" data-bs-slide="next">
<span class="carousel-control-next-icon"></span>
</button>
</div>
<script
src="./node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
<!-- <script
src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.
js"></script> -->
</body>
</html>
