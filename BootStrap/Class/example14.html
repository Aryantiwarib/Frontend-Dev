<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bootstrap 3 Panel Dashboard Example</title>
<link rel="stylesheet"
href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
</head>
<body>
<div class="container">
<h2 class="text-center">User Dashboard</h2>
<div class="row">
<!-- User Info Panel -->
<div class="col-md-4">
<div class="panel panel-primary">
<div class="panel-heading">Profile Overview</div>
<div class="panel-body">
<p><strong>Name:</strong> Aakash Vishwakarma</p>
<p><strong>Email:</strong> aakash@example.com</p>
<p><strong>Role:</strong> Web Developer</p>
</div>
<div class="panel-footer text-right">
<button class="btn btn-sm btn-default">Edit Profile</button>

</div>
</div>
</div>
<!-- Recent Activity Panel -->
<div class="col-md-4">
<div class="panel panel-info">
<div class="panel-heading">Recent Activity</div>
<div class="panel-body">
<ul>
<li>Uploaded a project to GitHub</li>
<li>Updated Bootstrap tutorial</li>
<li>Commented on a forum post</li>
</ul>
</div>
<div class="panel-footer text-right">
<a href="#" class="btn btn-sm btn-info">View All</a>
</div>
</div>
</div>
<!-- Notifications Panel -->
<div class="col-md-4">
<div class="panel panel-warning">
<div class="panel-heading">Notifications</div>
<div class="panel-body">
<p><span class="label label-danger">3</span> Pending Tasks</p>
<p><span class="label label-success">2</span> Approved Requests</p>
<p><span class="label label-info">1</span> New Message</p>
</div>
<div class="panel-footer text-right">
<button class="btn btn-sm btn-warning">Check Now</button>
</div>
</div>
</div>
</div>
</div>
</body>
</html>
