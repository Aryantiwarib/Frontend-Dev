<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Bootstrap 3 Well Example</title>
<link rel="stylesheet"
href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap.min.css">
</head>
<body>
<div class="container">
<header class="page-header">
<h1>Bootstrap 3 <code>.well</code> Examples (Deprecated)</h1>
</header>
<h3>Default Well</h3>
<div class="well">
This is a default Bootstrap 3 Well. It gives the content a light gray,
padded, and sunken appearance.
</div>
<h3>Large Well</h3>
<div class="well well-lg">
This is a Large Well (<code>.well-lg</code>) with increased padding.
</div>
<h3>Small Well</h3>
<div class="well well-sm">
This is a Small Well (<code>.well-sm</code>) with reduced padding.
</div>
</div>
</body>
</html>
